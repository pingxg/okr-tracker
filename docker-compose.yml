# Local or self-hosted run without any cloud account:
#
#   docker compose up --build
#   docker compose exec app node scripts/seed.js     # optional demo data
#
# Set OIDC_ISSUER, OIDC_CLIENT_ID and OIDC_CLIENT_SECRET (Microsoft Entra ID)
# and INITIAL_ADMIN_EMAIL, then open http://localhost:3000 and sign in with
# Microsoft, the only sign-in method.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: okr
      POSTGRES_PASSWORD: okr
      POSTGRES_DB: okr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U okr']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://okr:okr@db:5432/okr
      PUBLIC_URL: http://localhost:3000
      SESSION_SECRET: local-docker-session-secret-change-me
      NODE_ENV: production
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

volumes:
  pgdata:

# Render Blueprint. Frankfurt region keeps data in the EU and next to the
# existing Postgres instance.
#
# The app uses the existing database "okr" on our Render Postgres instance
# (shared with Metabase and Dagster), so no database is created here. Paste
# its connection string as DATABASE_URL (internal preferred). The instance
# requires TLS, so DATABASE_SSL stays true. Secrets marked `sync: false` are
# entered in the Render dashboard.
#
# After the first deploy:
#   - PUBLIC_URL = https://<service>.onrender.com (or your own domain)
#   - add <PUBLIC_URL>/api/v1/auth/callback as a Web redirect URI in the Entra
#     app registration
#   - the MCP address for AI assistants is <PUBLIC_URL>/mcp
services:
  - type: web
    name: okr-app
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      # Render Postgres requires TLS (internal and external connections)
      - key: DATABASE_SSL
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: AUTO_CREATE_USERS
        value: 'true'

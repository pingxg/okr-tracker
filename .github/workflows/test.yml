name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: okr
          POSTGRES_PASSWORD: okr
          POSTGRES_DB: okr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: npm install
        run: |
          npm ci
          npm --prefix server ci
        env:
          CI: true

      - name: Lint
        run: |
          npm run lint
          npm run lint:style

      - name: Frontend unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Server tests
        run: npm --prefix server test
        env:
          TEST_DATABASE_URL: postgres://okr:okr@localhost:5432/okr_test

      - name: Build
        run: npm run build
